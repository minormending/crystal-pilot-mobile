# Runs the checks that need nothing but the repository.
#
# There is deliberately no emulator here. Driving the game needs a ROM built
# from the pokecrystal disassembly, and no ROM, save or symbol file is
# distributed. What runs instead is two things: static checks over the
# repository, and behaviour tests against a fake Game Boy -- a work-RAM
# snapshot and scripted button responses, which is enough to test the decisions
# the pilot makes without a cartridge to make them against.
#
# Naming the job for what it actually covers keeps the badge honest.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node for the syntax pass, python for everything else. Both are already
      # on the runner; pinning them keeps a runner image change from being
      # indistinguishable from a real failure.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: App checks
        run: tools/check-app

      - name: Behaviour tests
        run: ./run-tests

      - name: Documentation is current
        run: tools/docs-check
